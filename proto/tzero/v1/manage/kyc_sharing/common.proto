 */
message KycApplicant {
  string first_name = 10 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  string last_name = 20 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  string registered_address_line_1 = 30 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  string registered_city = 40 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  string registered_state_province_region = 50 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  string registered_postal_code = 60 [(buf.validate.field).string = {min_len: 1, max_len: 16}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  string registered_country = 70 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  FileValue identity_document_front = 80 [(buf.validate.field).required = true];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue identity_document_back = 85;

  optional string email = 90 [(buf.validate.field).string = {max_len: 254, email: true}];

  optional string phone = 100 [(buf.validate.field).string = {min_len: 1, max_len: 20}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  optional string nationality = 110 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  // Calendar date as midnight UTC; a value with a time of day is rejected; a fraction of a second is dropped.
  optional google.protobuf.Timestamp date_of_birth = 120 [(buf.validate.field).cel = {
    message: "must be a date: midnight UTC with no time of day"
    expression: "this.getHours() == 0 && this.getMinutes() == 0 && this.getSeconds() == 0"
  }];

  optional string tax_identification_number = 130 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue proof_of_address = 140;

  // Zero or more provider-declared custom KYC fields, each identifier at most once.
  repeated CustomFieldValue custom_fields = 1000 [(buf.validate.field).repeated.max_items = 1000];
}

// Submission value for a Payout-Provider-declared custom field — the filled-in
// counterpart of FormField. Reused by KYB (main + UBO) and KYC
// submissions. Typed by the field's declared FormField type; the server checks
// the value arm matches the definition.
message CustomFieldValue {
  // References the custom field by its FormField.identifier.
  string identifier = 10 [(buf.validate.field).string = {
    pattern: "^[a-z][a-z0-9_]*$",
    max_len: 64
  }];

  oneof value {
    option (buf.validate.oneof).required = true;

    // At most FormField.String.max_length characters, and never more than 10000.
    string string = 20 [(buf.validate.field).string.max_len = 10000];
    // Calendar date as midnight UTC; a value with a time of day is rejected; a fraction of a second is dropped.
    google.protobuf.Timestamp date = 30 [(buf.validate.field).cel = {
      message: "must be a date: midnight UTC with no time of day"
      expression: "this.getHours() == 0 && this.getMinutes() == 0 && this.getSeconds() == 0"
    }];
    // A custom number has no range or sign check and may be negative.
    tzero.v1.common.Decimal number = 40;
    // no validation: the chosen key is validated by SingleSelect's own rules and checked against the form's
    // declared options server-side.
    SingleSelect single_select = 50;
    // no validation: the chosen keys are validated by MultiSelect's own rules and checked against the form's
    // declared options server-side.
    MultiSelect multi_select = 60;
    // no validation: the file reference is validated server-side against the requester's uploaded-file set;
    // FileValue.file_id carries its own gt:0 constraint.
    FileValue file = 70;
  }

  // The one chosen option key from the FormField's Select.options (single-select).
  message SingleSelect {
    string key = 10 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  }

  // Chosen option keys from the FormField's Select.options (multi-select).
  message MultiSelect {
    repeated string keys = 10 [(buf.validate.field).repeated = {
      min_items: 1,
      unique: true,
      items: {string: {min_len: 1, max_len: 64}}
    }];
  }
}


// ===================== Pagination (local per package) =====================

/** Offset/limit pagination request. */
message Page {
  optional uint32 page = 10 [(buf.validate.field).uint32.gte = 1];
  optional uint32 size = 20 [(buf.validate.field).uint32 = {gte: 1, lte: 50}];
}

/** Offset/limit pagination response metadata. */
message PageInfo {
  uint32 current_page = 10 [(buf.validate.field).uint32.gte = 1];
  uint32 page_size = 20 [(buf.validate.field).uint32.gte = 1];
  bool has_next = 30;
}
