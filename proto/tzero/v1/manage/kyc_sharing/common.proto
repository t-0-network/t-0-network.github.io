// Role-neutral applicant types shared by the Payout-Requester surface
// and the Payout-Provider surface.

/** Lifecycle state of an Applicant through the review state machine. */
enum ApplicantState {
  APPLICANT_STATE_UNSPECIFIED = 0;
  APPLICANT_STATE_DRAFT = 10;
  APPLICANT_STATE_REQUESTED = 20;
  APPLICANT_STATE_APPROVED = 30;
  APPLICANT_STATE_REJECTED = 40;
}

/** Which applicant form a list call selects: KYB (company) or KYC (private person). */
enum FormType {
  FORM_TYPE_UNSPECIFIED = 0;
  FORM_TYPE_KYB = 10;
  FORM_TYPE_KYC = 20;
}

// network_mandatory marks a standard-field catalogue member as a Network Mandatory
// Field: always included in every form, always required, and non-overridable.
// Members without the option are selectable.
extend google.protobuf.EnumValueOptions {
  bool network_mandatory = 60010;
}

// Network catalogues + closed value sets for select-type standard fields.
// A member's number is its stable identity: it is never reassigned
// or reused, and it does not change when the member's tier changes. Tier is carried by
// (network_mandatory) alone, so the Network Mandatory Fields are not necessarily the
// lowest-numbered members. A form presents its standard fields in ascending number order.
//
// Forms never list network-mandatory members; a form's reader takes them from this option.

enum StandardKybFieldType {
  STANDARD_KYB_FIELD_TYPE_UNSPECIFIED = 0;
  STANDARD_KYB_FIELD_TYPE_BUSINESS_NAME = 10 [(network_mandatory) = true];
