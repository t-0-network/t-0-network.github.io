/**
 * A reference to an already-uploaded file (KycFileService.UploadFile), by its stable id. File field values
 * carry only this reference; the bytes are uploaded out of band. Shared by standard and custom file fields.
 */
message FileValue {
  int64 file_id = 10 [(buf.validate.field).int64 = {gt: 0}];
}

/**
 * The applicant's filled-in KYB main-form values — the complete main-form state for each save (a snapshot:
 * stored values are replaced, and anything omitted is cleared). A draft may leave any field unset, including the
 * ones marked required here: which fields a given applicant owes is set by the Payout Provider's form, and
 * completeness is enforced when the applicant is submitted for review and on every save while it is rejected.
 * An empty value on a field without `optional` counts as unset.
 */
message KybApplicant {
  string business_name = 10 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  optional KybIndustry business_industry = 20 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  string registered_address_line_1 = 30 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  string registered_city = 40 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  string registered_state_province_region = 50 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  string registered_postal_code = 60 [(buf.validate.field).string = {min_len: 1, max_len: 16}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  string registered_country = 70 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  // Calendar date as midnight UTC; a value with a time of day is rejected; a fraction of a second is dropped.
  optional google.protobuf.Timestamp incorporation_date = 80 [(buf.validate.field).cel = {
    message: "must be a date: midnight UTC with no time of day"
    expression: "this.getHours() == 0 && this.getMinutes() == 0 && this.getSeconds() == 0"
  }];

  string registration_number = 90 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string tax_identification_number = 100 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string email = 110 [(buf.validate.field).string = {max_len: 254, email: true}];

  optional string website = 120 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  FileValue legal_presence_document = 130 [(buf.validate.field).required = true];

  FileValue ownership_structure_document = 140 [(buf.validate.field).required = true];

  FileValue control_structure_document = 150 [(buf.validate.field).required = true];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue proof_of_address = 160;

  optional KybBusinessType business_type = 170 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  optional string business_description = 180 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];

  optional string registration_authority = 190 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  optional string tax_authority = 200 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  optional string operational_address_line_1 = 210 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  optional string operational_city = 220 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string operational_state_province_region = 230 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string operational_postal_code = 240 [(buf.validate.field).string = {min_len: 1, max_len: 16}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  optional string operational_country = 250 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  optional string phone = 260 [(buf.validate.field).string = {min_len: 1, max_len: 20}];

  optional string primary_purpose_of_account = 270 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];

  optional string source_of_funds_description = 280 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];

  // Multi-select: an empty list means the field was not answered (a single choice is a 1-element list).
  repeated KybHighRiskActivity high_risk_activities = 290 [
    (buf.validate.field).repeated = {unique: true, items: {enum: {defined_only: true, not_in: [0]}}}
  ];

  // Non-negative when provided.
  optional tzero.v1.common.Decimal estimated_annual_revenue_usd = 300 [
    (buf.validate.field).cel = {
      message: "estimated_annual_revenue_usd must be non-negative"
      expression: "this.unscaled >= 0"
    }
  ];

  // Non-negative when provided.
  optional tzero.v1.common.Decimal expected_monthly_payments_usd = 310 [
    (buf.validate.field).cel = {
      message: "expected_monthly_payments_usd must be non-negative"
      expression: "this.unscaled >= 0"
    }
  ];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue company_details_document = 320;

  // Zero or more provider-declared custom main-form fields, each identifier at most once.
  repeated CustomFieldValue custom_fields = 1000 [(buf.validate.field).repeated.max_items = 1000];
}

/**
 * One beneficial owner's filled-in values (mirrors KybApplicant). Owners are identified positionally: the
 * request's `ubos` list is the full ordered set, and the response echoes them in the same order.
 */
message KybUbo {
  string first_name = 10 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  string last_name = 20 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  optional string email = 30 [(buf.validate.field).string = {max_len: 254, email: true}];

  // Calendar date as midnight UTC; a value with a time of day is rejected; a fraction of a second is dropped.
  optional google.protobuf.Timestamp date_of_birth = 40 [(buf.validate.field).cel = {
    message: "must be a date: midnight UTC with no time of day"
    expression: "this.getHours() == 0 && this.getMinutes() == 0 && this.getSeconds() == 0"
  }];

  FileValue identity_document_front = 50 [(buf.validate.field).required = true];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue identity_document_back = 55;

  // Multi-select: an empty list means the field was not answered (a single choice is a 1-element list).
  repeated KybUboRole roles = 60 [
    (buf.validate.field).repeated = {unique: true, items: {enum: {defined_only: true, not_in: [0]}}}
  ];

  optional string business_title = 70 [(buf.validate.field).string = {min_len: 1, max_len: 100}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  optional string nationality = 80 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  optional string phone = 90 [(buf.validate.field).string = {min_len: 1, max_len: 20}];

  optional string registered_address_line_1 = 100 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  optional string registered_city = 110 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string registered_state_province_region = 120 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  optional string registered_postal_code = 130 [(buf.validate.field).string = {min_len: 1, max_len: 16}];

  // ISO 3166-1 alpha-2; format-checked (2 uppercase letters), not membership-validated.
  optional string registered_country = 140 [(buf.validate.field).string = {pattern: "^[A-Z]{2}$"}];

  optional string tax_identification_number = 150 [(buf.validate.field).string = {min_len: 1, max_len: 35}];

  // Percentage of ownership; non-negative when provided.
  optional tzero.v1.common.Decimal share_proportion = 160 [
    (buf.validate.field).cel = {
      message: "share_proportion must be non-negative"
      expression: "this.unscaled >= 0"
    }
  ];

  // Calendar date as midnight UTC; a value with a time of day is rejected; a fraction of a second is dropped.
  optional google.protobuf.Timestamp relationship_established_at = 170 [(buf.validate.field).cel = {
    message: "must be a date: midnight UTC with no time of day"
    expression: "this.getHours() == 0 && this.getMinutes() == 0 && this.getSeconds() == 0"
  }];

  // no validation: the reference is validated by FileValue's own rules.
  optional FileValue proof_of_address = 180;

  // Zero or more provider-declared custom UBO sub-form fields, each identifier at most once.
  repeated CustomFieldValue custom_fields = 1000 [(buf.validate.field).repeated.max_items = 1000];
}

