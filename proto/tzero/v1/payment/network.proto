syntax = "proto3";

package tzero.v1.payment;

import "tzero/v1/common/common.proto";
import "tzero/v1/common/timeout.proto";
import "tzero/v1/common/payment_method.proto";
import "tzero/v1/common/payment_receipt.proto";
import "ivms101/v1/ivms/ivms101.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

/**
 * Publishes quotes and creates pay-out payments. Every method is safe to retry.
 */
service NetworkService {
  /**
   * Publishes pay-out quotes. Each request is a full snapshot: a quote left out is deleted.
   */
  rpc UpdateQuote(UpdateQuoteRequest) returns (UpdateQuoteResponse)  {
    option idempotency_level = IDEMPOTENT;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };

  /**
   * Returns the best pay-out quote for an amount. A quote whose credit line cannot cover the amount is not picked.
   */
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };

  /**
   * Creates a pay-out payment. With quote_id, the payment uses that quote from GetQuote.
   * Without it, the best quote is picked, as GetQuote does.
   */
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse) {
    option idempotency_level = IDEMPOTENT;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };

  /**
   * Reports that a payout is complete. Deprecated: use FinalizePayout.
   */
  rpc ConfirmPayout(ConfirmPayoutRequest) returns (ConfirmPayoutResponse)  {
    option deprecated = true;
    option idempotency_level = IDEMPOTENT;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };

  /**
   * Reports the final result of a payout: success with an optional receipt, or failure with a reason.
   */
  rpc FinalizePayout(FinalizePayoutRequest) returns (FinalizePayoutResponse){
    option idempotency_level = IDEMPOTENT;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };

  /**
   * Reports the result of a manual AML check on a payment.
   * On approval, the response carries the updated settlement/payout amount and quotes.
   */
  rpc CompleteManualAmlCheck(CompleteManualAmlCheckRequest) returns (CompleteManualAmlCheckResponse) {
    option idempotency_level = IDEMPOTENT;
    option (tzero.v1.common.timeout) = {seconds: 30};
  };
}

/*
 * Base currency is always USD, so the quotes are always in USD/currency format.
 */
message UpdateQuoteRequest {
  /**
   * Pay-out quotes. Each band has a unique client_quote_id.
   */
  repeated Quote pay_out = 10;
  reserved 20;
  reserved "pay_in";

  message Quote {
    string currency = 10 [(buf.validate.field).string = {
      len: 3,
      pattern: "^[A-Z]{3}$"
    }]; // BRL, EUR, GBP, etc. (ISO 4217 currency code)

    // Deprecated: rate type is no longer used; the server ignores the value.
    QuoteType quote_type = 20 [deprecated = true];
    // Payment method must be specified
    tzero.v1.common.PaymentMethodType payment_method = 25 [(buf.validate.field).required = true];

    repeated Band bands = 30 [(buf.validate.field).repeated = {
      min_items: 1
    }]; // list of bands for this quote

    // Expiration time of the quote. Must be at least the network's minimum quote validity after the
    // network receives the request; otherwise InvalidArgument.
    google.protobuf.Timestamp expiration = 60 [
      (buf.validate.field).required = true,
      (buf.validate.field).timestamp.gt_now = true
    ];

    google.protobuf.Timestamp timestamp = 70 [(buf.validate.field).required = true]; // timestamp quote was created

    message Band {

      string client_quote_id = 10 [(buf.validate.field).string = {
        min_len: 1,
        max_len: 64
      }]; // unique client generated id for this band

      tzero.v1.common.Decimal max_amount = 40 [
        (buf.validate.field).required = true,
        (buf.validate.field).cel = {
          message: "max_amount must be greater than zero"
          expression: "this.unscaled > 0"
        }
      ]; // Maximum amount of USD this band applies to.

      tzero.v1.common.Decimal rate = 50 [
        (buf.validate.field).required = true,
        (buf.validate.field).cel = {
          message: "rate must be greater than zero"
          expression: "this.unscaled > 0"
        }
      ]; // USD/currency rate

      /**
       * Fixed charge in USD per transfer, added to the settlement amount. Absent means no charge.
       */
      optional tzero.v1.common.Decimal fix = 60 [(buf.validate.field).cel = {
        message: "fix must be non-negative"
        expression: "this.unscaled >= 0"
      }];
    }
  }
}

message UpdateQuoteResponse {}

message GetQuoteRequest {
  PaymentAmount amount = 20 [(buf.validate.field).required = true]; // payment amount - must be either pay-out amount or settlement amount

  string pay_out_currency = 40 [(buf.validate.field).string = {len: 3, pattern: "^[A-Z]{3}$"}]; // ISO 4217 currency code, e.g. EUR, GBP, etc. in which the payout should be made

  tzero.v1.common.PaymentMethodType pay_out_method = 50 [(buf.validate.field).required = true]; // payment method to use for the payout, e.g. bank transfer, card, etc.

  QuoteType quote_type = 60 [(buf.validate.field).required = true]; // type of the quote, e.g. real-time
}

message GetQuoteResponse {

  oneof result {
    option (buf.validate.oneof).required = true;
    /**
     * A suitable quote was found for the provided parameters, with available credit or pre-settlement option.
     * Use the returned quoteId to call CreatePayment.
     */
    Success success = 20;
    /**
     * No quote can serve the request. The reason says why.
     */
    Failure failure = 30;
  };

  /**
   * The best quote of each provider with a credit line, for the requested amount.
   * Returned with both success and failure.
   */
  repeated ProviderQuote all_quotes = 40;

  message Success {
    tzero.v1.common.Decimal rate = 10 [(buf.validate.field).required = true]; // pay-out quote rate in settlement_currency/pay_out_currency, i.e. USD/pay_out_currency
    google.protobuf.Timestamp expiration = 20 [(buf.validate.field).timestamp.gt_now = true]; // expiration time of the payout quote
    QuoteId quote_id = 30 [(buf.validate.field).required = true]; // id of the payout quote

    tzero.v1.common.Decimal pay_out_amount = 40 [(buf.validate.field).required = true]; // pay-out amount in pay-out currency if the quote from response is used
    tzero.v1.common.Decimal settlement_amount = 50 [(buf.validate.field).required = true]; // settlement amount in settlement currency if the quote from response is used

    /**
     * Fixed charge in USD, included in settlement_amount.
     * The settlement amount is rounded up to the cent, and the pay-out amount is rounded down.
     */
    tzero.v1.common.Decimal fix = 60;
  }

  message Failure {
    Reason reason = 10;

    enum Reason {
      REASON_UNSPECIFIED = 0;
      // No quote fits the currency, payment method and amount, or no credit line exists.
      REASON_QUOTE_NOT_FOUND = 10;
      // Quotes exist, but no credit line covers the amount.
      // all_quotes shows the prefunding each provider needs.
      REASON_CREDIT_OR_PREDEPOSIT_REQUIRED = 20;
      // The settlement_amount is too small to pay out anything after the quote's fix.
      // Retry with a larger settlement_amount.
      REASON_AMOUNT_TOO_SMALL = 30;
    }
  }

  /**
   * Best quote for each provider with a credit line configured.
   * Contains settlement status and calculated amounts for the payment request.
   */
  message ProviderQuote {
    QuoteId quote_id = 10 [(buf.validate.field).required = true]; // Quote identification - can be used to initiate payment

    tzero.v1.common.Decimal rate = 20 [(buf.validate.field).required = true]; // Exchange rate: USD/pay_out_currency

    google.protobuf.Timestamp expiration = 30; // Quote validity period

    tzero.v1.common.Decimal pay_out_amount = 40 [(buf.validate.field).required = true]; // Payout amount in payout currency

    Settlement settlement = 50 [(buf.validate.field).required = true]; // Settlement details for this quote

    bool executable = 60; // Indicates payment can be initiated with this quote immediately and no pre-funding is required

    /** Fixed charge in USD per transfer for this provider's quote. */
    tzero.v1.common.Decimal fix = 70;

    /**
     * Settlement details between the Payout Requester and the Payout Provider.
     * All amounts are in USD (settlement currency).
     */
    message Settlement {
      tzero.v1.common.Decimal amount = 10 [(buf.validate.field).required = true]; // Settlement amount required for this payment

      tzero.v1.common.Decimal credit_limit = 20 [(buf.validate.field).required = true]; // Total credit limit from payout provider

      tzero.v1.common.Decimal total_used = 30 [(buf.validate.field).required = true]; // Total amount used from credit line (completed + reserved)

      tzero.v1.common.Decimal prefunding_amount = 50 [(buf.validate.field).required = true]; // Additional funding needed before this quote can be executed
    }
  }
}

message CreatePaymentRequest{
  /**
   * Client id of the payment. To retry, resend the same id, also with a new amount or quote.
   * Once accepted, the id returns that payment, or AlreadyExists if the amount or currency differs.
   * A retry of a `failure` under a new id can pay the payment out twice.
   */
  string payment_client_id = 10 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 64
  }];

  PaymentAmount amount = 30 [(buf.validate.field).required = true]; // payment amount - should be either pay-out amount or settlement amount

  string currency = 40 [(buf.validate.field).string = {len: 3, pattern: "^[A-Z]{3}$"}]; // pay-out currency
  tzero.v1.common.PaymentDetails payment_details = 50 [(buf.validate.field).required = true]; // pay-out payment details
  optional QuoteId quote_id = 60; // a quote from GetQuote; without it, the best quote is picked

  TravelRuleData travel_rule_data = 100 [(buf.validate.field).required = true]; // travel rule data

  message TravelRuleData {
    /**
     * the natural or legal person that requests payment with the Payout Requester
     */
    repeated ivms101.Person originator = 10 [(buf.validate.field).repeated.min_items = 1];

    /**
     * the natural or legal person or legal arrangement who is identified
     * by the originator as the receiver of the requested payment.
     */
    repeated ivms101.Person beneficiary = 20 [(buf.validate.field).repeated.min_items = 1];

    /**
     * Legal entity of the Payout Requester. Required only when the provider has more than one.
     */
    optional uint32 originator_provider_legal_entity_id = 30 [(buf.validate.field).uint32.gt = 0];
  }
}

message QuoteId {
  int64 quote_id = 30 [(buf.validate.field).int64.gt = 0]; // unique identifier of the quote within the specified provider

  int32 provider_id = 40 [(buf.validate.field).int32.gt = 0]; // provider id of the quote
}

message CreatePaymentResponse {
  string payment_client_id = 10 [(buf.validate.field).string.min_len = 1]; // client generated id supplied in the request

  oneof result {
    option (buf.validate.oneof).required = true;
    /**
     * The payment was accepted and will be passed to the payout provider.
     * A suitable quote was found for the pay-out currency and amount.
     */
    Accepted accepted = 20;

    // Deprecated: no longer returned.
    SettlementRequired settlement_required = 35 [deprecated = true];

    /**
     * The payment was not accepted. The reason says why.
     */
    Failure failure = 30;
  };

  message Accepted {
    uint64 payment_id = 10 [(buf.validate.field).uint64.gt = 0]; // payment ID assigned by the network
    tzero.v1.common.Decimal settlement_amount = 30 [(buf.validate.field).required = true];
    tzero.v1.common.Decimal payout_amount = 40 [(buf.validate.field).required = true];
    uint32 payout_provider_id = 50 [(buf.validate.field).uint32.gt = 0]; // payout provider id with the best quote selected for this payment
  }

  // Deprecated: no longer used.
  message SettlementRequired {
    option deprecated = true;
    uint64 payment_id = 10 [(buf.validate.field).uint64.gt = 0]; // payment ID assigned by the network
    tzero.v1.common.Decimal settlement_amount = 20 [(buf.validate.field).required = true];
    uint32 payout_provider_id = 30 [(buf.validate.field).uint32.gt = 0]; // payout provider id with the best quote selected for this payment
  }

  message Failure {
    Reason reason = 10;

    enum Reason {
      REASON_UNSPECIFIED = 0;
      // No quote fits the currency, payment method and amount, or no credit line exists.
      REASON_QUOTE_NOT_FOUND = 10;
      // Quotes exist, but no credit line covers the amount.
      // GetQuote shows the prefunding each provider needs.
      REASON_CREDIT_OR_PREDEPOSIT_REQUIRED = 20;
      // The amount is above the pinned quote's maximum.
      // Retry with a smaller amount, or with a new quote from GetQuote.
      REASON_AMOUNT_EXCEEDS_QUOTE_BAND = 30;
      // The pinned quote has expired. Retry with a new quote from GetQuote.
      REASON_QUOTE_EXPIRED = 40;
      // The pinned quote id is unknown. A retry with the same quote id fails again.
      REASON_QUOTE_ID_UNKNOWN = 50;
      // The settlement_amount is too small to pay out anything after the quote's fix.
      // Retry with a larger settlement_amount.
      REASON_AMOUNT_TOO_SMALL = 60;
    }
  }
}

message ConfirmPayoutRequest {
  option deprecated = true;
  uint64 payment_id = 10 [(buf.validate.field).uint64.gt = 0]; // payment id assigned by the network, this is the same payment id that was provided in the PayoutRequest

  uint64 payout_id = 20 [(buf.validate.field).uint64.gt = 0, deprecated = true]; // deprecated, this is 1->1 mapping between payment and payout ids

  /**
  * Payment receipt might contain metadata about payment recognizable by the Payout Requester.
  */
  optional tzero.v1.common.PaymentReceipt receipt = 30;
}

message ConfirmPayoutResponse{
  option deprecated = true;
}

message CompleteManualAmlCheckRequest {
  uint64 payment_id = 10 [(buf.validate.field).uint64.gt = 0];

  oneof result {
    option (buf.validate.oneof).required = true;
    Approved approved = 30;
    Rejected rejected = 40;
  }

  message Approved {}

  message Rejected {
    string reason = 10 [(buf.validate.field).string.max_len = 1024];
  }
}

message CompleteManualAmlCheckResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    Approved approved = 30;
    Rejected rejected = 40;
  }

  message Approved {
    /**
    * updated amount based on updated quote approved by the Payout Requester
     */
    tzero.v1.common.Decimal pay_out_amount = 10 [(buf.validate.field).required = true];

    /* updated settlement amount based on updated quote approved by the Payout Requester */
    tzero.v1.common.Decimal settlement_amount = 20 [(buf.validate.field).required = true];

    /* unique identifier of the updated pay-out quote */
    int64 pay_out_quote_id = 30 [(buf.validate.field).int64.gt = 0];

    /* client_quote_id of the updated pay-out quote assigned by the Payout Provider */
    string pay_out_client_quote_id = 40 [(buf.validate.field).string.max_len = 64];
  }

  // Rejected means that the updated quotes were rejected by the Payout Requester, and the Payout Provider should not proceed
  // with the payout.
  message Rejected {}
}


// The amount as a pay-out amount or as a settlement amount. The other amount is computed from it.
message PaymentAmount {
  oneof amount {
    option (buf.validate.oneof).required = true;
    // Amount in the pay-out currency. At most 2 decimal places; trailing zeros are allowed; otherwise InvalidArgument.
    tzero.v1.common.Decimal pay_out_amount = 20 [(buf.validate.field).cel = {
      message: "pay_out_amount must be greater than zero"
      expression: "this.unscaled > 0"
    }];
    // Settlement amount in the settlement currency. At most 2 decimal places; trailing zeros are allowed; otherwise InvalidArgument.
    tzero.v1.common.Decimal settlement_amount = 30 [(buf.validate.field).cel = {
      message: "settlement_amount must be greater than zero"
      expression: "this.unscaled > 0"
    }];
  }
}

enum QuoteType {
  QUOTE_TYPE_UNSPECIFIED = 0;
  QUOTE_TYPE_REALTIME = 1;
}

message FinalizePayoutRequest {
  uint64 payment_id = 10 [(buf.validate.field).uint64.gt = 0]; // payment id assigned by the network, this is the same payment id that was provided in the PayoutRequest

  oneof result {
    option (buf.validate.oneof).required = true;
    Success success = 30;
    Failure failure = 40;
  }

  message Success {
    /**
    * Payment receipt might contain metadata about payment recognizable by the Payout Requester.
    */
    optional tzero.v1.common.PaymentReceipt receipt = 30;
  }
  message Failure {
    string reason = 10 [(buf.validate.field).string.max_len = 1024];
  }
}

message FinalizePayoutResponse {

}